# SAROPA LINTS CUSTOM CONFIG
# Settings that persist across tier changes and --reset.

# ANALYSIS SETTINGS
max_issues: 500
output: both
log_level: info # off | error | warning | info | debug
# lane: light # full | light (default when absent: light)
# shed_rules: false # true disables low-severity rules under memory pressure

# RULE PACKS
# Enable migration / compatibility packs by uncommenting:
# rule_packs:
#   enabled:
#     - collection_compat
#     - dart_sdk_3_2

# PLATFORM SETTINGS
# Disable platforms your project doesn't target.
platforms:
  ios: true
  android: true
  macos: false
  web: false
  windows: false
  linux: false

