name: ethiocal
description: >-
  Zemen: Ethiopian Calendar (ዘመን). Your Time. Your Tradition. Your Calendar.
  Dual Ethiopian & Gregorian calendar with Bahire Hasab, holidays, fasting,
  converter, events, widgets, and optional football scores.
publish_to: none
version: 1.0.0+1
environment:
  sdk: ^3.13.7
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.5.0
  shared_preferences: ^2.5.6
  sqflite: ^2.4.6
  path: ^1.9.1
  intl: ^0.20.3
  share_plus: ^13.3.1
  flutter_local_notifications: ^23.0.2
  timezone: ^0.11.2
  permission_handler: ^13.0.2
  path_provider: ^2.1.6
  google_fonts: ^9.0.0
  http: ^1.6.0
  google_mobile_ads: ^9.2.0
  material_ui: ^1.11.0
  cupertino_ui: ^1.1.6
  file_picker: ^13.4.0
dev_dependencies:
  saropa_lints: ^17.2.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: any
flutter:
  uses-material-design: true
  assets:
    - assets/logo/
    - assets/football/leagues/
    - assets/football/teams/
    - assets/data/ethiopian_calendar/
    - docs/privacy-policy.html
